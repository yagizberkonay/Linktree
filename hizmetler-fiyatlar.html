<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hizmetler ve Fiyatlar / Services &amp; Pricing</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root{ color-scheme: light; }
  html,body{ background:#F9F9FB; }
  body{ font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:#d4d4d8; border-radius:9999px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .tab-row::-webkit-scrollbar{ display:none; }
  .tab-row{ -ms-overflow-style:none; scrollbar-width:none; }
  .card-enter{ animation: cardIn .35s ease both; }
  @keyframes cardIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .card-enter{ animation:none; }
  }
  [data-i18n], [data-i18n-ph]{ transition: opacity .15s ease; }
</style>
</head>
<body class="min-h-screen antialiased text-zinc-900">

<div class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-[#F9F9FB]/90 backdrop-blur-sm border-b border-zinc-200/80">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-5 flex items-center justify-between gap-4">
      <div class="min-w-0">
        <p class="text-[11px] tracking-[0.18em] uppercase text-zinc-400 font-medium" data-i18n="eyebrow">Hermes Software</p>
        <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-zinc-900" data-i18n="title">Hizmetler ve Fiyatlar</h1>
      </div>
      <button id="langToggle" class="shrink-0 inline-flex items-center gap-2 rounded-full border border-zinc-200/80 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:border-zinc-300 hover:text-zinc-900 transition-colors shadow-sm">
        <i class="ph ph-translate text-base"></i>
        <span id="langLabel">EN</span>
      </button>
    </div>
  </header>

  <main class="flex-1">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-6 sm:py-8">

      <!-- Search -->
      <div class="relative mb-5">
        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></i>
        <input id="searchInput" type="text" data-i18n-ph="searchPh"
          class="w-full rounded-2xl border border-zinc-200/80 bg-white pl-11 pr-4 py-3 text-sm text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-300 shadow-sm"
          placeholder="Hizmet ara...">
      </div>

      <!-- Category tabs -->
      <div class="tab-row -mx-5 sm:mx-0 px-5 sm:px-0 mb-7 overflow-x-auto">
        <div id="tabRow" class="flex items-center gap-2 min-w-max sm:flex-wrap"></div>
      </div>

      <!-- Results meta -->
      <div class="flex items-center justify-between mb-4">
        <p id="resultsCount" class="text-sm text-zinc-500"></p>
        <div class="hidden sm:flex items-center gap-3 text-[11px] text-zinc-400">
          <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-zinc-300"></span><span data-i18n="tierStarter">Başlangıç</span></span>
          <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-zinc-500"></span><span data-i18n="tierGrowth">Büyüme</span></span>
          <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-zinc-700"></span><span data-i18n="tierScale">Ölçek</span></span>
          <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-zinc-900"></span><span data-i18n="tierEnterprise">Kurumsal</span></span>
        </div>
      </div>

      <!-- Content -->
      <div id="content"></div>

      <!-- Empty state -->
      <div id="emptyState" class="hidden flex-col items-center justify-center text-center py-20">
        <i class="ph ph-magnifying-glass-minus text-3xl text-zinc-300 mb-3"></i>
        <p class="text-zinc-500 text-sm" data-i18n="emptyTitle">Aramanızla eşleşen bir hizmet bulunamadı.</p>
        <p class="text-zinc-400 text-xs mt-1" data-i18n="emptySub">Farklı bir anahtar kelime deneyin ya da tüm kategorilere göz atın.</p>
      </div>

    </div>
  </main>

  <footer class="border-t border-zinc-200/80 py-6">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-zinc-400">
      <p data-i18n="footerNote">Fiyatlar proje kapsamına göre değişiklik gösterir ve nihai teklif niteliği taşımaz.</p>
      <p>© 2026 Hermes Software Inc.</p>
    </div>
  </footer>

</div>

  ]},
  { id: "consulting", icon: "ph-compass", tr: "Danışmanlık", en: "Consulting", items: [
    ["Yazılım Danışmanlığı","Software Consulting",2000,10000,"/Saat","/hr"],
    ["Mimari Danışmanlık","Architecture Consulting",50000,500000],
    ["Kod Denetimi","Code Audit",20000,200000],
    ["Performans Optimizasyonu","Performance Optimization",50000,500000],
    ["Teknik Proje Yönetimi","Technical Project Management",30000,300000,"/Ay","/mo"],
  ]},
  { id: "support", icon: "ph-wrench", tr: "Aylık Destek Paketleri", en: "Monthly Support Packages", items: [
    ["Bakım Paketi","Maintenance Package",10000,50000,"/Ay","/mo"],
    ["Profesyonel Geliştirme Paketi","Professional Development Package",50000,150000,"/Ay","/mo"],

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let lang = "tr";
let activeCat = "all";
let query = "";

const fmt = (n) => n.toLocaleString("tr-TR");

// tier based on the minimum price of the service (log scale bucketing)
function tierOf(min){
  if (min < 50000) return { key:"starter", cls:"bg-zinc-300", pct: 25 };
  if (min < 500000) return { key:"growth", cls:"bg-zinc-500", pct: 50 };
  if (min < 2000000) return { key:"scale", cls:"bg-zinc-700", pct: 75 };
  return { key:"enterprise", cls:"bg-zinc-900", pct: 100 };
}

function t(key){ return STRINGS[lang][key]; }

function applyStaticI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (STRINGS[lang][k] !== undefined) el.textContent = STRINGS[lang][k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const k = el.getAttribute("data-i18n-ph");
    if (STRINGS[lang][k] !== undefined) el.setAttribute("placeholder", STRINGS[lang][k]);
  });
  document.getElementById("langLabel").textContent = lang === "tr" ? "EN" : "TR";
}

function buildTabs(){
  const row = document.getElementById("tabRow");
  const tabs = [{ id:"all", icon:"ph-squares-four", tr:"Tümü", en:"All" }, ...CATEGORIES];
  row.innerHTML = tabs.map(c => {
    const label = lang === "tr" ? c.tr : c.en;
    const active = activeCat === c.id;
    return `<button data-cat="${c.id}"
      class="tab-btn inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium border transition-colors
      ${active ? "bg-zinc-900 text-white border-zinc-900" : "bg-white text-zinc-600 border-zinc-200/80 hover:border-zinc-300 hover:text-zinc-900"}">
      <i class="ph ${c.icon} text-base"></i>${label}
    </button>`;
  }).join("");
  row.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeCat = btn.getAttribute("data-cat"); query=""; document.getElementById("searchInput").value=""; render(); });
  });
}

function matchesQuery(item){
  if (!query) return true;
  const q = query.toLocaleLowerCase("tr-TR");
  return item[0].toLocaleLowerCase("tr-TR").includes(q) || item[1].toLowerCase().includes(q);
}

function serviceCard(item, catIcon){
  const [tr, en, min, max, unitTr, unitEn] = item;
  const name = lang === "tr" ? tr : en;
  const unit = (lang === "tr" ? unitTr : unitEn) || "";
  const tier = tierOf(min);
  return `<div class="card-enter group rounded-2xl border border-zinc-200/80 bg-white p-5 hover:border-zinc-300 hover:shadow-sm transition-all">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="h-9 w-9 shrink-0 rounded-xl bg-zinc-100 flex items-center justify-center">
        <i class="ph ${catIcon} text-base text-zinc-500"></i>
      </div>
      <span class="inline-flex items-center gap-1 text-[10px] font-medium text-zinc-400">
        <span class="h-1.5 w-1.5 rounded-full ${tier.cls}"></span>
        ${t("tier" + tier.key.charAt(0).toUpperCase() + tier.key.slice(1))}
      </span>
    </div>
    <h3 class="text-sm font-semibold text-zinc-900 leading-snug mb-3">${name}</h3>
    <p class="text-base font-semibold text-zinc-900 tracking-tight">${fmt(min)} – ${fmt(max)} <span class="text-sm font-medium text-zinc-500">TL${unit}</span></p>
    <div class="mt-3 h-1 w-full rounded-full bg-zinc-100 overflow-hidden">
      <div class="h-full rounded-full ${tier.cls}" style="width:${tier.pct}%"></div>
    </div>
  </div>`;
}

function render(){
  buildTabs();
  const content = document.getElementById("content");
  const empty = document.getElementById("emptyState");
  const resultsCount = document.getElementById("resultsCount");

  const cats = activeCat === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === activeCat);

  let totalItems = 0;
  let sectionsHtml = "";

  cats.forEach(cat=>{
    const filtered = cat.items.filter(matchesQuery);
    if (filtered.length === 0) return;
    totalItems += filtered.length;
    const catLabel = lang === "tr" ? cat.tr : cat.en;
    sectionsHtml += `
      <section class="mb-9">
        ${activeCat === "all" ? `<div class="flex items-center gap-2 mb-4">
          <i class="ph ${cat.icon} text-lg text-zinc-400"></i>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">${catLabel}</h2>
          <span class="text-xs text-zinc-300">·</span>
          <span class="text-xs text-zinc-400">${filtered.length}</span>
        </div>` : ""}
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${filtered.map(item => serviceCard(item, cat.icon)).join("")}
        </div>
      </section>`;
  });

  content.innerHTML = sectionsHtml;

  if (totalItems === 0){
    empty.classList.remove("hidden");
    empty.classList.add("flex");
  } else {
    empty.classList.add("hidden");
    empty.classList.remove("flex");
  }

  const catCount = cats.filter(c => c.items.some(matchesQuery)).length;
  resultsCount.textContent = `${totalItems} ${t("resultsOne")}${activeCat === "all" && !query ? ` · ${catCount} ${t("resultsCat")}` : ""}`;

  applyStaticI18n();
}

document.getElementById("langToggle").addEventListener("click", ()=>{
  lang = lang === "tr" ? "en" : "tr";
  render();
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  query = e.target.value;
  render();
});

render();
</script>
</body>
</html>
